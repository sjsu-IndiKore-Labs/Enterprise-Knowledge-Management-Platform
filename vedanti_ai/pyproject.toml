[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekm-ai-service"
version = "0.1.0"
description = "AI and RAG service for the Enterprise Knowledge Management Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
  "boto3>=1.35,<2",
  "openai>=1.50,<2",
  "pgvector>=0.3,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "sse-starlette>=2.1,<3",
  "tiktoken>=0.8,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
