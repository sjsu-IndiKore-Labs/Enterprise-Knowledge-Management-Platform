# Local stack. Owner: Manali.  Images are built from the templates in manali_devops/docker/.
#   make up        -> infra only (postgres + localstack)
#   make up-apps   -> infra + every application service (profile "apps")
#   make mocks     -> Prism mocks of core-api (:4010) and ai-service (:4011) (profile "mocks")
# Container-to-container hostnames are the service names below (contracts/ports-and-services.md).
name: ekm

x-app: &app
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &app-env
    POSTGRES_HOST: postgres
    POSTGRES_SSLMODE: disable
    AWS_ENDPOINT_URL: http://localstack:4566
    AI_SERVICE_URL: http://ai-service:8000

services:
  # ---------------------------------------------------------------- infra
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ekm}
      POSTGRES_USER: ${POSTGRES_USER:-ekm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekm_local_password}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ekm} -d ${POSTGRES_DB:-ekm}"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8   # pinned: newer images may require a LocalStack auth token
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-west-2}
      S3_DOCUMENTS_BUCKET: ${S3_DOCUMENTS_BUCKET:-ekm-documents-local}
      SQS_DOCUMENT_INGEST_QUEUE: ${SQS_DOCUMENT_INGEST_QUEUE:-ekm-document-ingest}
      SQS_DOCUMENT_STATUS_QUEUE: ${SQS_DOCUMENT_STATUS_QUEUE:-ekm-document-status}
      SQS_AUDIT_EVENTS_QUEUE: ${SQS_AUDIT_EVENTS_QUEUE:-ekm-audit-events}
    ports: ["4566:4566"]
    volumes:
      - ./manali_devops/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------------- apps
  core-api:
    <<: *app
    profiles: ["apps"]
    image: ekm/core-api:local
    build:
      context: .                                    # repo root: image includes contracts/database/migrations
      dockerfile: manali_devops/docker/java-service.Dockerfile
      args: { SERVICE: core-api, PORT: "8080" }
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }

  audit-service:
    <<: *app
    profiles: ["apps"]
    image: ekm/audit-service:local
    build:
      context: .
      dockerfile: manali_devops/docker/java-service.Dockerfile
      args: { SERVICE: audit-service, PORT: "8081" }
    ports: ["8081:8081"]
    depends_on:
      core-api: { condition: service_healthy }      # core-api applies the Flyway migrations first

  ai-service:
    <<: *app
    profiles: ["apps"]
    image: ekm/ai-service:local
    build:
      context: vedanti_ai
      dockerfile: ../manali_devops/docker/python-service.Dockerfile
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }

  ai-worker:                                        # same image as ai-service, SQS ingestion loop
    <<: *app
    profiles: ["apps"]
    image: ekm/ai-service:local
    build:
      context: vedanti_ai
      dockerfile: ../manali_devops/docker/python-service.Dockerfile
    command: ["python", "-m", "app.ingestion.worker"]
    healthcheck:
      disable: true
    depends_on:
      ai-service: { condition: service_started }

  web:
    <<: *app
    profiles: ["apps"]
    image: ekm/web:local
    build:
      context: changhyun_frontend
      dockerfile: ../manali_devops/docker/node-web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports: ["3000:3000"]
    depends_on:
      - core-api

  # ---------------------------------------------------------------- mocks
  mock-core-api:
    profiles: ["mocks"]
    image: stoplight/prism:5
    command: ["mock", "-h", "0.0.0.0", "--cors", "/contracts/openapi/core-api.yaml"]
    volumes: ["./contracts:/contracts:ro"]
    ports: ["4010:4010"]

  mock-ai-service:
    profiles: ["mocks"]
    image: stoplight/prism:5
    command: ["mock", "-h", "0.0.0.0", "-p", "4010", "/contracts/openapi/ai-service.yaml"]
    volumes: ["./contracts:/contracts:ro"]
    ports: ["4011:4010"]

volumes:
  pgdata:
