spring.application.name=core-api
server.port=${CORE_API_PORT:8080}

# Logging
logging.format=${LOG_FORMAT:json}

# Database & pgvector connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:knowledge_hub}}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Jackson global config (camelCase, ISO-8601 UTC dates)
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Flyway Migrations (supports both classpath and ../contracts/database/migrations)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# File Upload limits (Contract: 25MB default, configurable via NEXT_PUBLIC_MAX_UPLOAD_MB)
ekm.upload.max-mb=${NEXT_PUBLIC_MAX_UPLOAD_MB:25}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# AWS / LocalStack (S3 & SQS)
aws.region=${AWS_REGION:us-west-2}
aws.endpoint-url=${AWS_ENDPOINT_URL:http://localhost:4566}
aws.access-key-id=${AWS_ACCESS_KEY_ID:test}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}
s3.documents-bucket=${S3_DOCUMENTS_BUCKET:ekm-documents-local}
sqs.document-ingest-queue=${SQS_DOCUMENT_INGEST_QUEUE:ekm-document-ingest}
sqs.document-status-queue=${SQS_DOCUMENT_STATUS_QUEUE:ekm-document-status}
sqs.audit-events-queue=${SQS_AUDIT_EVENTS_QUEUE:ekm-audit-events}
sqs.status-polling.enabled=${SQS_STATUS_POLLING_ENABLED:true}

# Auth & Service-to-service
jwt.secret=${JWT_SECRET:local-dev-jwt-secret-change-me-must-be-at-least-32-bytes}
jwt.issuer=${JWT_ISSUER:ekm-core-api}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
internal.service-token=${INTERNAL_SERVICE_TOKEN:local-internal-token-change-me}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AI Service (Milestone 3)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.search-timeout-seconds=10
ai.service.answer-timeout-seconds=60
ai.service.fallback-enabled=${AI_FALLBACK_ENABLED:false}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info
